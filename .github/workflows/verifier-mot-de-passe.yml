name: Vérifier le mot de passe de la base

# Éprouve le secret SUPABASE_DB_PASSWORD contre la base de production, sans que
# sa valeur apparaisse où que ce soit.
#
# À quoi cela sert. Un secret GitHub ne se relit pas : une fois collé, rien ne
# dit s'il porte le bon mot de passe. Son seul consommateur est l'export de
# sauvegarde.yml, suspendu depuis l'incident du 15 octobre — un mot de passe
# faux ne se découvrirait donc qu'au moment de rétablir les sauvegardes, c'est-à-
# dire précisément quand on compte sur elles.
#
# À relancer après chaque réinitialisation du mot de passe dans Supabase
# (Project Settings > Database > Reset database password), qui invalide le
# secret jusqu'à ce qu'on le recolle.
#
# Ne lit rien. Compte les tables de `public` et s'arrête là.

on:
  workflow_dispatch:

jobs:
  verifier:
    name: Connexion à la base de production
    # Figé comme dans sauvegarde.yml : GitHub bascule `ubuntu-latest` sur
    # Ubuntu 26 le 19 octobre 2026, et un changement d'image sous une
    # vérification d'identifiants rendrait son verdict illisible.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Se connecter avec le secret
        env:
          # Passé par PGPASSWORD, et non dans une chaîne de connexion : les mots
          # de passe générés par Supabase contiennent des caractères comme @, /
          # ou #, qui découpent une URL au mauvais endroit et donnent un
          # « password authentication failed » indiscernable d'un mauvais mot de
          # passe. C'est l'erreur qu'avait faite la première version de
          # sauvegarde.yml.
          MDP: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -uo pipefail

          if [ -z "${MDP:-}" ]; then
            echo "::error::Le secret SUPABASE_DB_PASSWORD est absent. Settings > Secrets and variables > Actions."
            exit 1
          fi

          REF=$(tr -d '[:space:]' < supabase/projet-production)
          echo "Projet visé : $REF"

          # Par le pooler : l'hôte direct du projet est en IPv6 seulement, et
          # injoignable depuis un runner GitHub.
          #
          # `ON_ERROR_STOP=1` n'est pas décoratif : sans lui psql sort en 0
          # malgré une erreur, et le workflow annoncerait « vérifié » sur un
          # refus d'authentification.
          essayer() {
            PGPASSWORD="$1" psql \
              -h aws-0-eu-west-1.pooler.supabase.com \
              -p 5432 \
              -U "postgres.$REF" \
              -d postgres \
              -v ON_ERROR_STOP=1 \
              -t -A \
              -c "SELECT 'Tables dans public : ' || count(*) FROM pg_tables WHERE schemaname = 'public';" \
              2>&1
          }

          # Un échec n'est pas l'autre, et la première version de ce fichier les
          # a confondus : elle enchaînait deux essais, gardait la sortie du
          # second et jetait celle du premier. Une panne passagère du pooler a
          # donc été rapportée comme « mot de passe entouré d'espaces », alors
          # que le secret était juste et propre. Trois règles en sont sorties :
          #
          #   - la sortie de chaque essai est imprimée, toujours ;
          #   - un échec de connexion est retenté, un refus d'authentification
          #     ne l'est pas — réessayer un mauvais mot de passe ne le corrige
          #     pas ;
          #   - la valeur nettoyée n'est essayée que si elle diffère vraiment de
          #     celle du secret. Sans cela, l'essai « nettoyé » refaisait le même
          #     essai et ses succès devenaient un diagnostic imaginaire.
          verdict=""
          for tentative in 1 2 3; do
            if sortie=$(essayer "$MDP"); then
              echo "$sortie"
              echo "::notice::Le secret ouvre la base, tel quel. Les sauvegardes pourront s'exécuter."
              exit 0
            fi
            echo "Tentative $tentative : $sortie"
            case "$sortie" in
              *"password authentication failed"*) verdict="refus" ; break ;;
              *)                                  verdict="injoignable" ;;
            esac
            sleep 5
          done

          if [ "$verdict" = "injoignable" ]; then
            echo "::error::La base n'a pas répondu après trois tentatives. Ce n'est pas le mot de passe : il n'a jamais été refusé. Relancez, et regardez l'état du projet sur Supabase."
            exit 1
          fi

          # `strip` et non `tr -d` : la même opération que sauvegarde.yml, qui
          # retire ce qui entoure sans toucher à une espace intérieure. Un mot
          # de passe peut en contenir une.
          NETTOYE=$(printf '%s' "$MDP" | python3 -c 'import sys;print(sys.stdin.read().strip(), end="")')
          if [ "$NETTOYE" != "$MDP" ]; then
            if sortie=$(essayer "$NETTOYE"); then
              echo "$sortie"
              # Pas un échec : l'export nettoie le secret de la même façon, donc
              # les sauvegardes passeront. Signalé quand même, parce que toute
              # autre lecture du secret buterait dessus.
              echo "::warning::Le secret porte le bon mot de passe, mais entouré d'espaces ou d'un retour à la ligne. L'export le nettoie, donc les sauvegardes fonctionneront. Le recoller sans éviterait de s'y fier."
              exit 0
            fi
            echo "Nettoyé : $sortie"
          fi

          echo "::error::Le secret SUPABASE_DB_PASSWORD est refusé par la base. L'hôte et l'utilisateur sont bien ceux du projet : c'est la valeur du mot de passe qui ne correspond pas. Réinitialisez-le dans Supabase (Project Settings > Database > Reset database password) et recollez-le dans le secret."
          exit 1
