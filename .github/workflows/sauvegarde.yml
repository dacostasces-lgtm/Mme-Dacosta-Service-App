name: Sauvegarde de la base

# Le forfait Supabase gratuit ne conserve aucune sauvegarde automatique. Le 7
# octobre 2026, un `supabase db reset --linked` lancé depuis le dépôt d'un autre
# projet a effacé la production, et il n'y avait rien à restaurer — voir
# docs/incident-2026-10-07.md.
#
# Ceci en tient lieu, gratuitement : un export nocturne, conservé en artefact.
# Ce n'est pas l'équivalent du forfait Pro, et le README de l'artefact le dit
# aussi — on perd jusqu'à vingt-quatre heures d'écritures, les artefacts ne se
# gardent que quatre-vingt-dix jours, et les fichiers des buckets n'y sont pas.
# Mais c'est la différence entre « reconstruire le schéma » et « tout a disparu ».
#
# L'archive est CHIFFRÉE avant d'être déposée : le dépôt est public, et les
# artefacts d'un dépôt public se téléchargent par n'importe quel compte GitHub.
# Jusqu'au 12 octobre 2026 ils partaient en clair — noms, numéros, positions,
# mots de passe chiffrés et jetons de connexion de tous les inscrits (audit de
# sécurité de ce jour). Sans le secret BACKUP_PASSPHRASE, le job échoue au
# lieu de déposer quoi que ce soit.

# ⚠️ EXPORT NOCTURNE SUSPENDU — 15 octobre 2026
#
# Ce dépôt est public. Les artefacts d'un dépôt public sont téléchargeables par
# n'importe quel titulaire d'un compte GitHub, et chaque exécution y déposait un
# export complet de la base : noms, emails, numéros, positions GPS, empreintes
# de mots de passe et jetons de session.
#
# Dix exports sont ainsi exposés depuis le 7 octobre, et expirent en janvier
# 2027. Les supprimer demande un accès à GitHub que je n'ai pas — c'est à faire
# à la main, onglet Actions, puis dans chaque exécution, section Artifacts.
#
# Le déclenchement planifié est retiré pour que plus aucun export ne parte.
# `workflow_dispatch` reste : une exécution manuelle demeure possible, mais
# seulement pour qui sait ce qu'il fait.
#
# À rétablir une fois que l'export sera chiffré par une phrase secrète
# (BACKUP_PASSPHRASE), ou que le dépôt sera passé en privé — et pas avant.
on:
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  exporter:
    name: Export quotidien
    # Figé plutôt que `ubuntu-latest` : GitHub fait basculer cette étiquette
    # sur Ubuntu 26 à partir du 19 octobre 2026. Un changement d'image pendant
    # la nuit est exactement le genre de surprise qu'on ne veut pas sur une
    # sauvegarde ni sur la CI. À monter délibérément, en vérifiant que les deux
    # workflows passent.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Le secret ne porte que le mot de passe, pas l'URL entière.
      #
      # La première version demandait l'URL complète, et elle a échoué en
      # « password authentication failed » : les mots de passe générés par
      # Supabase contiennent des caractères comme @, / ou #, qui découpent une
      # chaîne de connexion au mauvais endroit dès qu'ils n'y sont pas encodés.
      # L'erreur est alors indiscernable d'un mauvais mot de passe.
      #
      # L'hôte et l'utilisateur se déduisent de la référence du projet, qui est
      # versionnée ; il ne reste donc à coller qu'un mot de passe brut, que ce
      # script encode lui-même.
      - name: Construire la chaîne de connexion
        env:
          MDP: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MDP" ]; then
            echo "::error::Le secret SUPABASE_DB_PASSWORD est absent. Settings > Secrets and variables > Actions."
            exit 1
          fi
          REF=$(tr -d '[:space:]' < supabase/projet-production)
          # Le secret est débarrassé de ce qui l'entoure avant d'être encodé.
          # Un copier-coller emporte volontiers le retour à la ligne de la
          # sélection, et `quote()` le transforme alors en %0A : la connexion
          # échoue en « password authentication failed », indiscernable d'un
          # mauvais mot de passe. C'est arrivé deux fois ici. Aucun mot de passe
          # Supabase ne commence ni ne finit par une espace, donc rien de
          # légitime n'est perdu.
          MDP_ENCODE=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["MDP"].strip(), safe=""))')
          # Dans l'environnement du job et masqué dans les journaux : il porte
          # le mot de passe.
          echo "::add-mask::$MDP_ENCODE"
          echo "URL=postgresql://postgres.$REF:$MDP_ENCODE@aws-0-eu-west-1.pooler.supabase.com:5432/postgres" >> "$GITHUB_ENV"
          echo "Projet visé : $REF"

      # Trois exports, parce qu'une restauration les rejoue dans cet ordre.
      # `auth` est inclus délibérément : sans lui on restaure des profils dont
      # aucun compte ne peut plus se connecter. Les mots de passe chiffrés et
      # les jetons de connexion en font partie : l'archive n'est déposée que
      # chiffrée, voir plus bas.
      # `URL` vient de l'étape précédente, par GITHUB_ENV.
      - name: Exporter
        run: |
          set -euo pipefail
          mkdir -p sauvegarde
          supabase db dump --db-url "$URL" --role-only -f sauvegarde/1-roles.sql
          supabase db dump --db-url "$URL" -s auth,public,storage -f sauvegarde/2-schema.sql
          supabase db dump --db-url "$URL" --data-only --use-copy \
            -s auth,public,storage -f sauvegarde/3-donnees.sql

      - name: Contrôler que l'export n'est pas vide
        run: |
          set -euo pipefail
          # Un pg_dump peut réussir en ne produisant rien d'utile — une
          # sauvegarde vide qu'on croit bonne est pire que pas de sauvegarde.
          test -s sauvegarde/2-schema.sql
          grep -q 'CREATE TABLE IF NOT EXISTS "public"."profiles"' sauvegarde/2-schema.sql
          grep -q 'COPY "auth"."users"' sauvegarde/3-donnees.sql
          echo "Tables exportées : $(grep -c 'CREATE TABLE' sauvegarde/2-schema.sql)"
          echo "Politiques RLS   : $(grep -c 'CREATE POLICY' sauvegarde/2-schema.sql)"

      - name: Mode d'emploi joint à l'archive
        run: |
          mkdir -p depot
          cat > depot/LIRE-MOI.md <<'TXT'
          # Restaurer cette sauvegarde

          L'archive est chiffrée. La phrase secrète est celle du secret GitHub
          BACKUP_PASSPHRASE (GitHub ne la réaffiche pas : gardez-en une copie
          hors de GitHub). Pour la déchiffrer :

              gpg --decrypt sauvegarde.tar.gz.gpg > sauvegarde.tar.gz
              tar -xzf sauvegarde.tar.gz

          Puis rejouer dans l'ordre, contre le bon projet :

              ./scripts/verifier-projet.sh
              psql "$SUPABASE_DB_URL" -f 1-roles.sql
              psql "$SUPABASE_DB_URL" -f 2-schema.sql
              psql "$SUPABASE_DB_URL" -f 3-donnees.sql

          ## Ce que cette sauvegarde ne contient pas

          - Les **fichiers** des buckets `avatars` et `cvs`. Seules les lignes de
            `storage.objects` y sont : après restauration, les enregistrements
            pointeront vers des fichiers absents.
          - Les écritures des dernières heures, jusqu'à vingt-quatre.
          - Les réglages du projet — Site URL, Redirect URLs, SMTP. Ils vivent
            hors de la base et survivent de toute façon à un effacement.
          TXT

      # Chiffrement symétrique AES-256 : seule la phrase secrète rouvre
      # l'archive. Rien n'est déposé si elle manque ou si elle est trop courte
      # pour résister à une recherche par force brute.
      - name: Chiffrer l'archive
        env:
          PHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ "${#PHRASE}" -lt 20 ]; then
            echo "::error::Le secret BACKUP_PASSPHRASE est absent ou fait moins de 20 caractères. Settings > Secrets and variables > Actions."
            exit 1
          fi
          tar -czf sauvegarde.tar.gz sauvegarde
          printf '%s' "$PHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            -o depot/sauvegarde.tar.gz.gpg sauvegarde.tar.gz
          rm -rf sauvegarde sauvegarde.tar.gz
          # Contrôle : rien d'autre que l'archive chiffrée et le mode d'emploi.
          ls -la depot
          test "$(ls depot | sort | tr '\n' ' ')" = "LIRE-MOI.md sauvegarde.tar.gz.gpg "

      # Une archive chiffrée qu'on ne peut pas rouvrir ne vaut rien, et cela ne
      # se découvre qu'au moment où l'on en a besoin — c'est-à-dire trop tard.
      # Elle est donc déchiffrée ici même, avec la phrase du secret, et son
      # contenu revérifié après l'aller-retour. Une phrase que GitHub aurait
      # tronquée, un chiffrement muet, une archive corrompue : tout cela fait
      # échouer l'export au lieu de déposer un fichier inutile qu'on croirait
      # bon pendant des mois.
      - name: Vérifier que l'archive se rouvre
        env:
          PHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$PHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt depot/sauvegarde.tar.gz.gpg > controle.tar.gz
          tar -xzf controle.tar.gz
          # Les mêmes contrôles que sur l'export brut, mais de l'autre côté du
          # chiffrement : c'est le chemin qu'une restauration empruntera.
          grep -q 'CREATE TABLE IF NOT EXISTS "public"."profiles"' sauvegarde/2-schema.sql
          grep -q 'COPY "auth"."users"' sauvegarde/3-donnees.sql
          echo "L'archive se rouvre : schéma et comptes retrouvés après déchiffrement."
          rm -rf controle.tar.gz sauvegarde

      - uses: actions/upload-artifact@v7
        with:
          name: sauvegarde-${{ github.run_id }}
          path: depot/
          # Le maximum autorisé. Au-delà, il faut sortir l'archive de GitHub.
          retention-days: 90
