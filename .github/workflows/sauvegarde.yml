name: Sauvegarde de la base

# Le forfait Supabase gratuit ne conserve aucune sauvegarde automatique. Le 7
# octobre 2026, un `supabase db reset --linked` lancé depuis le dépôt d'un autre
# projet a effacé la production, et il n'y avait rien à restaurer — voir
# docs/incident-2026-10-07.md.
#
# Ceci en tient lieu, gratuitement : un export nocturne, conservé en artefact.
# Ce n'est pas l'équivalent du forfait Pro, et le README de l'artefact le dit
# aussi — on perd jusqu'à vingt-quatre heures d'écritures, les artefacts ne se
# gardent que quatre-vingt-dix jours, et les fichiers des buckets n'y sont pas.
# Mais c'est la différence entre « reconstruire le schéma » et « tout a disparu ».

on:
  schedule:
    # 02h00 UTC, soit 03h00 à Brazzaville. Décalé des tâches pg_cron de la base,
    # planifiées à 03h17 et 03h41 UTC, pour ne pas exporter pendant qu'elles
    # écrivent.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  exporter:
    name: Export quotidien
    # Figé plutôt que `ubuntu-latest` : GitHub fait basculer cette étiquette
    # sur Ubuntu 26 à partir du 19 octobre 2026. Un changement d'image pendant
    # la nuit est exactement le genre de surprise qu'on ne veut pas sur une
    # sauvegarde ni sur la CI. À monter délibérément, en vérifiant que les deux
    # workflows passent.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Le secret ne porte que le mot de passe, pas l'URL entière.
      #
      # La première version demandait l'URL complète, et elle a échoué en
      # « password authentication failed » : les mots de passe générés par
      # Supabase contiennent des caractères comme @, / ou #, qui découpent une
      # chaîne de connexion au mauvais endroit dès qu'ils n'y sont pas encodés.
      # L'erreur est alors indiscernable d'un mauvais mot de passe.
      #
      # L'hôte et l'utilisateur se déduisent de la référence du projet, qui est
      # versionnée ; il ne reste donc à coller qu'un mot de passe brut, que ce
      # script encode lui-même.
      - name: Construire la chaîne de connexion
        env:
          MDP: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MDP" ]; then
            echo "::error::Le secret SUPABASE_DB_PASSWORD est absent. Settings > Secrets and variables > Actions."
            exit 1
          fi
          REF=$(tr -d '[:space:]' < supabase/projet-production)
          MDP_ENCODE=$(python3 -c 'import os,urllib.parse;print(urllib.parse.quote(os.environ["MDP"], safe=""))')
          # Dans l'environnement du job et masqué dans les journaux : il porte
          # le mot de passe.
          echo "::add-mask::$MDP_ENCODE"
          echo "URL=postgresql://postgres.$REF:$MDP_ENCODE@aws-0-eu-west-1.pooler.supabase.com:5432/postgres" >> "$GITHUB_ENV"
          echo "Projet visé : $REF"

      # Trois exports, parce qu'une restauration les rejoue dans cet ordre.
      # `auth` est inclus délibérément : sans lui on restaure des profils dont
      # aucun compte ne peut plus se connecter. Les mots de passe chiffrés en
      # font partie, donc l'artefact est sensible — d'où un dépôt privé.
      # `URL` vient de l'étape précédente, par GITHUB_ENV.
      - name: Exporter
        run: |
          set -euo pipefail
          mkdir -p sauvegarde
          supabase db dump --db-url "$URL" --role-only -f sauvegarde/1-roles.sql
          supabase db dump --db-url "$URL" -s auth,public,storage -f sauvegarde/2-schema.sql
          supabase db dump --db-url "$URL" --data-only --use-copy \
            -s auth,public,storage -f sauvegarde/3-donnees.sql

      - name: Contrôler que l'export n'est pas vide
        run: |
          set -euo pipefail
          # Un pg_dump peut réussir en ne produisant rien d'utile — une
          # sauvegarde vide qu'on croit bonne est pire que pas de sauvegarde.
          test -s sauvegarde/2-schema.sql
          grep -q 'CREATE TABLE IF NOT EXISTS "public"."profiles"' sauvegarde/2-schema.sql
          grep -q 'COPY "auth"."users"' sauvegarde/3-donnees.sql
          echo "Tables exportées : $(grep -c 'CREATE TABLE' sauvegarde/2-schema.sql)"
          echo "Politiques RLS   : $(grep -c 'CREATE POLICY' sauvegarde/2-schema.sql)"

      - name: Mode d'emploi joint à l'archive
        run: |
          cat > sauvegarde/LIRE-MOI.md <<'TXT'
          # Restaurer cette sauvegarde

          Rejouer dans l'ordre, contre le bon projet :

              ./scripts/verifier-projet.sh
              psql "$SUPABASE_DB_URL" -f 1-roles.sql
              psql "$SUPABASE_DB_URL" -f 2-schema.sql
              psql "$SUPABASE_DB_URL" -f 3-donnees.sql

          ## Ce que cette sauvegarde ne contient pas

          - Les **fichiers** des buckets `avatars` et `cvs`. Seules les lignes de
            `storage.objects` y sont : après restauration, les enregistrements
            pointeront vers des fichiers absents.
          - Les écritures des dernières heures, jusqu'à vingt-quatre.
          - Les réglages du projet — Site URL, Redirect URLs, SMTP. Ils vivent
            hors de la base et survivent de toute façon à un effacement.
          TXT

      - uses: actions/upload-artifact@v7
        with:
          name: sauvegarde-${{ github.run_id }}
          path: sauvegarde/
          # Le maximum autorisé. Au-delà, il faut sortir l'archive de GitHub.
          retention-days: 90
